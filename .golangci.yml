version: "2"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
  exclusions:
    generated: lax

linters:
  default: all
  disable:
    - depguard
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - funlen
    - gochecknoglobals
    - gomodguard
    - mnd
    - nlreturn
    - noinlineerr
    - paralleltest
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 12
    funlen:
      lines: 80
    gosec:
      excludes:
        - G103
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
        path: retry/retry.go
      - linters:
          - asasalint
        path: _test.go
